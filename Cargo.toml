cargo-features = [
    "different-binary-name",
    "metabuild",
    "multiple-build-scripts",
    "open-namespaces",
    "panic-immediate-abort",
    "path-bases",
    "unstable-editions",
]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }

absolute_paths = "allow"
arbitrary_source_item_ordering = "allow"
arithmetic_side_effects = "allow"
big_endian_bytes = "allow"
blanket_clippy_restriction_lints = "allow"
cargo_common_metadata = "allow"
cast_precision_loss = "allow"
create_dir = "allow"
else_if_without_else = "allow"
exhaustive_structs = "allow"
field_scoped_visibility_modifiers = "allow"
float_arithmetic = "allow"
implicit_return = "allow"
inline_modules = "allow"
integer_division_remainder_used = "allow"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_trait_methods = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_without_reason = "allow"
non_ascii_literal = "allow"
panic = "allow"
print_stderr = "allow"
print_stdout = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
redundant_pub_crate = "allow"
self_named_module_files = "allow"
semicolon_outside_block = "allow"
separated_literal_suffix = "allow"
similar_names = "allow"
single_call_fn = "allow"
tests_outside_test_module = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
undocumented_unsafe_blocks = "allow"
unneeded_field_pattern = "allow"
unwrap_used = "allow"
use_debug = "allow"
wildcard_dependencies = "allow"

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
keyword_idents = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
refining_impl_trait = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

missing_docs = "allow"

[profile.release]
opt-level = 3
debug = "none"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "immediate-abort"
incremental = false
codegen-units = 1
rpath = false
trim-paths = "all"
codegen-backend = "llvm"

[package]
name = "web-rs"
version = "0.1.0"
edition = "2024"
autotests = false

[lib]
test = false

[[bin]]
name = "web-rs"
path = "src/main.rs"
test = false

[[test]]
name = "integration"
path = "tests/integration/scenarios.rs"

[[test]]
name = "e2e"
path = "tests/e2e/journeys.rs"

[dependencies]
anyhow = { version = "*", public = true }
axum = { version = "*", features = ["macros"], public = true }
bytes = { version = "*", public = true }
chrono = { version = "*", default-features = false, features = [
    "clock",
    "std",
] }
clap = { git = "https://github.com/clap-rs/clap", features = [
    "derive",
    "deprecated",
    "string",
    "wrap_help",
], public = true }
clap_builder = { git = "https://github.com/clap-rs/clap", public = true }
content_inspector = "*"
flate2 = "*"
fancy-regex = { git = "https://github.com/fancy-regex/fancy-regex", public = true }
finesse = { git = "https://github.com/ecmwf/aviso-client" }
futures = { version = "*", public = true }
http = { version = "*", public = true }
http-acl = "*"
http-body-util = "*"
mime = "*"
nanoid = "*"
num-traits = "*"
path-slash = "*"
percent-encoding = "*"
rapidfuzz = "*"
reqwest = { git = "https://github.com/seanmonstar/reqwest", default-features = false, features = [
    "deflate",
    "gzip",
    "json",
    "rustls",
], public = true }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", features = [
    "macros",
    "schemars",
    "server",
    "transport-io",
    "transport-streamable-http-server",
], public = true }
rustdoc-types = "*"
schemars = { version = "*", features = ["derive"] }
serde = { version = "*", features = ["derive"], public = true }
serde-saphyr = { git = "https://github.com/bourumir-wyngs/serde-saphyr" }
snmalloc-rs = { git = "https://github.com/microsoft/snmalloc", features = [
    "native-cpu",
    "lto",
] }
sonic-rs = { git = "https://github.com/cloudwego/sonic-rs", public = true }
thiserror = "*"
tiktoken = "*"
tokio = { version = "*", features = [
    "fs",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter", "fmt"] }
url = { version = "*", public = true }
walkdir = "*"
zstd = "*"

[dev-dependencies]
tempfile = "*"
tokio = { version = "*", features = ["process"] }
